name: pdf_maker
description: A production-quality Photo-to-PDF Maker mobile app for iOS and Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # PDF Generation & Printing
  pdf: ^3.10.8
  printing: ^5.13.1
  syncfusion_flutter_pdf: ^34.2.4

  # Image Handling & Manipulation
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  image: ^4.2.0
  flutter_image_compress: ^2.3.0

  # Persistence & Storage
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # File Management & Sharing
  file_picker: ^12.0.0
  share_plus: ^13.3.0
  permission_handler: ^13.0.1
  open_filex: ^4.4.0

  # UI & Design System
  cupertino_icons: ^1.0.6
  intl: ^0.20.3
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
